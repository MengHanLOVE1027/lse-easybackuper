name: Dev → Main PR

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create PR to main
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check if PR already exists
        id: check
        shell: bash
        run: |
          OPEN_PR=$(gh pr list --base main --head dev --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$OPEN_PR" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$OPEN_PR" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build PR body
        id: body
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ steps.version.outputs.version }}"

          # 获取 dev 相对于 main 的提交
          git fetch origin main
          COMMITS=$(gh api "repos/${{ github.repository }}/compare/main...dev" \
            --jq '[.commits[]? | select(.author.login != "github-actions[bot]")] | map("- \(.commit.message | split("\n")[0]) (@\(.author.login))") | join("\n")' \
            2>/dev/null || echo "")
          COMMITS="${COMMITS:-无新提交}"

          # 提取贡献者
          AUTHORS=$(gh api "repos/${{ github.repository }}/compare/main...dev" \
            --jq '[.commits[].author.login // empty] | unique | map(select(. != null and . != "github-actions[bot]")) | map("@" + .) | join(" ")' 2>/dev/null || echo "")

          # ── 从 CHANGELOG.md 提取当前版本的分类总结 ──
          CHANGELOG_SUMMARY=""
          if [ -f CHANGELOG.md ]; then
            CHANGELOG_SUMMARY=$(awk -v ver="$VERSION" '
              BEGIN { found=0 }
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found && /^---$/ { exit }
              found
            ' CHANGELOG.md | awk 'NF{p=1} p' || echo "")
          fi

          # 判断版本类型
          case "$VERSION" in
            *beta*|*alpha*|*rc*|*dev*) TYPE="🧪 测试版" ;;
            *) TYPE="🚀 正式版" ;;
          esac

          # ── 组装 PR Body ──
          BODY=$(cat <<EOF
          ## ${TYPE}: EasyBackuper v${VERSION}

          ### 📝 更新内容 · Changes
          EOF
          )

          # CHANGELOG.md 分类总结优先
          if [ -n "$CHANGELOG_SUMMARY" ]; then
            BODY="${BODY}"$'\n'"${CHANGELOG_SUMMARY}"$'\n'
            BODY="${BODY}"$'\n'"---"$'\n'
            BODY="${BODY}"$'\n'"<details>"$'\n'
            BODY="${BODY}"$'\n'"<summary>📋 原始提交记录</summary>"$'\n'
            BODY="${BODY}"$'\n'
          fi

          BODY="${BODY}${COMMITS}"

          if [ -n "$CHANGELOG_SUMMARY" ]; then
            BODY="${BODY}"$'\n'
            BODY="${BODY}"$'\n'"</details>"
          fi

          BODY="${BODY}"$'\n'
          BODY="${BODY}"$'\n'"### 👥 贡献者 · Contributors"$'\n'
          BODY="${BODY}"$'\n'"${AUTHORS}"

          {
            echo "BODY<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or Update PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "更新已有 PR #${{ steps.check.outputs.pr_number }}"
            gh pr edit "${{ steps.check.outputs.pr_number }}" \
              --title "v${{ steps.version.outputs.version }}: Dev → Main" \
              --body "${{ steps.body.outputs.BODY }}"
          else
            echo "创建新 PR"
            gh pr create \
              --base main \
              --head dev \
              --title "v${{ steps.version.outputs.version }}: Dev → Main" \
              --body "${{ steps.body.outputs.BODY }}"
          fi
