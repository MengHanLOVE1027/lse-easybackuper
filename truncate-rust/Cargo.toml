[package]
name = "mhlove-truncate"
version = "0.1.0"
edition = "2021"
description = "A fast parallel file truncation tool for Minecraft server backup"

[dependencies]
serde_json = "1"
rayon = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization"] }

[profile.release]
opt-level = "z"     # 优化体积
lto = true           # 链接时优化
strip = true         # 去除调试符号
